<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMU 조종 모니터</title>
<style>
  /*
    레이아웃: 좌측 자세계(피치/롤 아트러피셜 호라이즌) + 중앙 헤딩 테이프 /
    고도 게이지 + 우측 상태 패널(데드맨/UxV/연결) — 하단 전체폭에 원시 시리얼 로그.
    조종석 HUD 느낌의 다크 테마로 고정(라이트 테마 없음 — 의도적 단일 톤).
  */
  :root{
    --bg:#0a0e0f;
    --panel:#11171a;
    --line:#1f2b2e;
    --fg:#cfe8df;
    --fg-dim:#5f7a74;
    --accent:#4ee8a0;
    --warn:#ffb13d;
    --danger:#ff5a5a;
    color-scheme: dark;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);}
  body{
    font-family:'SF Mono','JetBrains Mono',Consolas,Menlo,monospace;
    min-height:100vh;
    padding:16px;
    padding-block:16px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  h1{
    font-size:1.05rem;
    letter-spacing:.06em;
    margin:0;
    font-weight:700;
    color:var(--fg);
    text-transform:uppercase;
  }
  .sub{color:var(--fg-dim); font-size:.78rem; letter-spacing:.03em;}

  header{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid var(--line);
    padding-bottom:12px;
  }
  .brand{display:flex; flex-direction:column; gap:2px;}

  .controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  button{
    font:inherit;
    font-size:.82rem;
    letter-spacing:.04em;
    text-transform:uppercase;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--fg);
    padding:9px 16px;
    border-radius:4px;
    cursor:pointer;
  }
  button:hover{border-color:var(--accent); color:var(--accent);}
  button:disabled{opacity:.35; cursor:default;}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  button.primary{border-color:var(--accent); color:var(--accent);}
  button.ghost{color:var(--fg-dim);}

  .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--danger);
    box-shadow:0 0 6px var(--danger);
    display:inline-block;
    flex:none;
  }
  .dot.live{background:var(--accent); box-shadow:0 0 8px var(--accent);}
  .status-line{display:flex; align-items:center; gap:8px; font-size:.78rem; color:var(--fg-dim);}

  main{
    display:grid;
    grid-template-columns: 1.1fr 1fr 0.9fr;
    gap:14px;
    flex:none;
  }
  @media (max-width:860px){
    main{grid-template-columns:1fr;}
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .panel-title{
    font-size:.72rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--fg-dim);
  }

  canvas{display:block; width:100%; height:auto; max-width:100%;}

  .readout-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .readout{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:4px;
    padding:8px 10px;
    min-width:0;
  }
  .readout .k{font-size:.66rem; color:var(--fg-dim); letter-spacing:.05em; text-transform:uppercase;}
  .readout .v{font-size:1.15rem; font-variant-numeric:tabular-nums; margin-top:2px;}

  .alt-wrap{display:flex; gap:10px; align-items:stretch; flex:1; min-height:200px;}
  .alt-bar-track{
    position:relative;
    width:34px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:4px;
    flex:none;
    overflow:hidden;
  }
  .alt-bar-fill{
    position:absolute; left:0; right:0; bottom:50%;
    background:linear-gradient(180deg, var(--accent), #1c6d4c);
    transition:height .08s linear, bottom .08s linear;
  }
  .alt-mid{
    position:absolute; left:0; right:0; top:50%;
    height:1px; background:var(--fg-dim);
  }
  .alt-readout{display:flex; flex-direction:column; justify-content:center; gap:6px;}

  .pill{
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    font-size:.8rem;
    letter-spacing:.04em;
    width:fit-content;
  }
  .pill.on{border-color:var(--accent); color:var(--accent); background:rgba(78,232,160,.08);}
  .pill.off{color:var(--fg-dim);}
  .pill.mode{border-color:var(--warn); color:var(--warn); background:rgba(255,177,61,.08);}

  .big-state{
    font-size:1.5rem;
    font-weight:700;
    letter-spacing:.03em;
  }
  .big-state.hitl{color:var(--accent);}
  .big-state.hotl{color:var(--fg-dim);}

  footer{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:1;
    min-height:160px;
  }
  .log{
    flex:1;
    overflow-y:auto;
    overflow-x:auto;
    font-size:.74rem;
    line-height:1.55;
    color:var(--fg-dim);
    white-space:pre;
    min-width:0;
  }
  .log .line{color:var(--fg);}
  .log .err{color:var(--danger);}

  .warnbox{
    border:1px solid var(--warn);
    background:rgba(255,177,61,.08);
    color:var(--warn);
    padding:10px 14px;
    border-radius:6px;
    font-size:.82rem;
    display:none;
  }
  .warnbox.show{display:block;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>IMU 조종 모니터</h1>
    <span class="sub">Team421 · NU40-DK 시리얼 데이터 시각화</span>
  </div>
  <div class="controls">
    <span class="status-line"><span class="dot" id="statusDot"></span><span id="statusText">연결 안 됨</span></span>
    <button class="primary" id="connectBtn">보드 연결</button>
    <button id="disconnectBtn" disabled>연결 해제</button>
    <button class="ghost" id="simBtn">데모 재생</button>
  </div>
</header>

<div class="warnbox" id="unsupportedWarn">
  이 브라우저는 Web Serial API를 지원하지 않아. 데스크탑 크롬이나 엣지에서 열어줘 (사파리/파이어폭스/모바일 브라우저는 안 됨).
</div>

<main>
  <div class="panel">
    <div class="panel-title">자세 (Pitch / Roll)</div>
    <canvas id="attitudeCanvas" width="360" height="300"></canvas>
    <div class="readout-grid">
      <div class="readout"><div class="k">Pitch</div><div class="v" id="pitchVal">0.0°</div></div>
      <div class="readout"><div class="k">Roll</div><div class="v" id="rollVal">0.0°</div></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">헤딩 / 고도</div>
    <canvas id="compassCanvas" width="320" height="140"></canvas>
    <div class="alt-wrap">
      <div class="alt-bar-track">
        <div class="alt-mid"></div>
        <div class="alt-bar-fill" id="altFill"></div>
      </div>
      <div class="alt-readout">
        <div class="readout"><div class="k">Heading</div><div class="v" id="headingVal">0.0°</div></div>
        <div class="readout"><div class="k">Altitude Cmd</div><div class="v" id="altVal">0</div></div>
        <div class="readout"><div class="k">Yaw Rate</div><div class="v" id="yawVal">0.0°/s</div></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">조종 상태</div>
    <div class="big-state hotl" id="modeState">HOTL (자율)</div>
    <span class="pill off" id="deadmanPill">● 데드맨 OFF</span>
    <span class="pill mode" id="uxvPill">UxV: DRONE</span>
    <span class="pill off" id="returnPill">RETURN</span>
    <div class="panel-title" style="margin-top:4px;">수신</div>
    <div class="readout"><div class="k">라인 수</div><div class="v" id="lineCount">0</div></div>
  </div>
</main>

<footer>
  <div class="panel-title">원시 시리얼 로그 (115200bps)</div>
  <div class="log" id="logBox"></div>
</footer>

<script>
(() => {
  const connectBtn = document.getElementById('connectBtn');
  const disconnectBtn = document.getElementById('disconnectBtn');
  const simBtn = document.getElementById('simBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const unsupportedWarn = document.getElementById('unsupportedWarn');
  const logBox = document.getElementById('logBox');
  const lineCountEl = document.getElementById('lineCount');

  const pitchVal = document.getElementById('pitchVal');
  const rollVal = document.getElementById('rollVal');
  const headingVal = document.getElementById('headingVal');
  const altVal = document.getElementById('altVal');
  const yawVal = document.getElementById('yawVal');
  const altFill = document.getElementById('altFill');
  const modeState = document.getElementById('modeState');
  const deadmanPill = document.getElementById('deadmanPill');
  const uxvPill = document.getElementById('uxvPill');
  const returnPill = document.getElementById('returnPill');

  const attCanvas = document.getElementById('attitudeCanvas');
  const attCtx = attCanvas.getContext('2d');
  const compCanvas = document.getElementById('compassCanvas');
  const compCtx = compCanvas.getContext('2d');

  let port = null, reader = null, keepReading = false, simTimer = null;
  let lineCount = 0;
  const MAX_LOG_LINES = 300;

  function setStatus(live, text) {
    statusDot.classList.toggle('live', live);
    statusText.textContent = text;
  }

  function appendLog(text, isErr) {
    const row = document.createElement('div');
    row.className = isErr ? 'err' : 'line';
    row.textContent = text;
    logBox.appendChild(row);
    while (logBox.childNodes.length > MAX_LOG_LINES) logBox.removeChild(logBox.firstChild);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function drawAttitude(pitch, roll) {
    const w = attCanvas.width, h = attCanvas.height;
    attCtx.clearRect(0, 0, w, h);
    attCtx.save();
    attCtx.translate(w / 2, h / 2);
    attCtx.rotate(-roll * Math.PI / 180);

    const pxPerDeg = 4.2;
    const offsetY = Math.max(-90, Math.min(90, pitch)) * pxPerDeg;

    attCtx.save();
    attCtx.translate(0, offsetY);
    const skyGrad = attCtx.createLinearGradient(0, -400, 0, 0);
    skyGrad.addColorStop(0, '#0d2f3f');
    skyGrad.addColorStop(1, '#154a5e');
    attCtx.fillStyle = skyGrad;
    attCtx.fillRect(-400, -400, 800, 400);

    const groundGrad = attCtx.createLinearGradient(0, 0, 0, 400);
    groundGrad.addColorStop(0, '#2e2210');
    groundGrad.addColorStop(1, '#1a1408');
    attCtx.fillStyle = groundGrad;
    attCtx.fillRect(-400, 0, 800, 400);

    attCtx.strokeStyle = 'rgba(207,232,223,0.35)';
    attCtx.lineWidth = 1;
    attCtx.beginPath();
    attCtx.moveTo(-400, 0); attCtx.lineTo(400, 0);
    attCtx.stroke();

    attCtx.strokeStyle = 'rgba(207,232,223,0.25)';
    attCtx.font = '11px monospace';
    attCtx.fillStyle = 'rgba(207,232,223,0.5)';
    for (let d = -60; d <= 60; d += 15) {
      if (d === 0) continue;
      const y = -d * pxPerDeg;
      const lineW = (d % 30 === 0) ? 60 : 32;
      attCtx.beginPath();
      attCtx.moveTo(-lineW / 2, y); attCtx.lineTo(lineW / 2, y);
      attCtx.stroke();
      if (d % 30 === 0) {
        attCtx.fillText(String(d), lineW / 2 + 4, y + 4);
      }
    }
    attCtx.restore();

    attCtx.beginPath();
    attCtx.arc(0, 0, 140, 0, Math.PI * 2);
    attCtx.clip();
    attCtx.restore();

    attCtx.save();
    attCtx.translate(w / 2, h / 2);
    attCtx.strokeStyle = '#4ee8a0';
    attCtx.lineWidth = 3;
    attCtx.lineCap = 'round';
    attCtx.beginPath();
    attCtx.moveTo(-34, 0); attCtx.lineTo(-10, 0);
    attCtx.moveTo(10, 0); attCtx.lineTo(34, 0);
    attCtx.stroke();
    attCtx.beginPath();
    attCtx.arc(0, 0, 3, 0, Math.PI * 2);
    attCtx.fillStyle = '#4ee8a0';
    attCtx.fill();

    attCtx.strokeStyle = 'rgba(207,232,223,0.5)';
    attCtx.lineWidth = 1.5;
    attCtx.beginPath();
    attCtx.arc(0, 0, 141, Math.PI * 1.15, Math.PI * 1.85);
    attCtx.stroke();
    attCtx.restore();
  }

  function drawCompass(heading) {
    const w = compCanvas.width, h = compCanvas.height;
    compCtx.clearRect(0, 0, w, h);
    compCtx.fillStyle = '#11171a';
    compCtx.fillRect(0, 0, w, h);

    const cx = w / 2, cy = h - 18;
    const pxPerDeg = 2.6;
    compCtx.save();
    compCtx.beginPath();
    compCtx.rect(0, 0, w, h);
    compCtx.clip();

    compCtx.font = '12px monospace';
    compCtx.textAlign = 'center';
    for (let d = -90; d <= 90; d += 5) {
      const deg = (((heading + d) % 360) + 360) % 360;
      const x = cx + d * pxPerDeg;
      const major = Math.round(deg) % 30 === 0;
      compCtx.strokeStyle = major ? '#4ee8a0' : 'rgba(207,232,223,0.3)';
      compCtx.lineWidth = major ? 2 : 1;
      compCtx.beginPath();
      compCtx.moveTo(x, cy - 14); compCtx.lineTo(x, cy - (major ? 28 : 20));
      compCtx.stroke();
      if (major) {
        compCtx.fillStyle = '#cfe8df';
        compCtx.fillText(Math.round(deg) + '°', x, cy - 34);
      }
    }
    compCtx.restore();

    compCtx.strokeStyle = '#ffb13d';
    compCtx.lineWidth = 2;
    compCtx.beginPath();
    compCtx.moveTo(cx, cy - 40); compCtx.lineTo(cx, cy + 6);
    compCtx.stroke();
    compCtx.beginPath();
    compCtx.moveTo(cx - 6, cy + 6); compCtx.lineTo(cx + 6, cy + 6); compCtx.lineTo(cx, cy + 14);
    compCtx.closePath();
    compCtx.fillStyle = '#ffb13d';
    compCtx.fill();
  }

  function updateUI(d) {
    pitchVal.textContent = d.pitch.toFixed(1) + '°';
    rollVal.textContent = d.roll.toFixed(1) + '°';
    headingVal.textContent = d.heading.toFixed(1) + '°';
    yawVal.textContent = d.yaw.toFixed(1) + '°/s';
    altVal.textContent = String(d.alt);

    const pct = Math.max(-127, Math.min(127, d.alt)) / 127;
    const magnitude = Math.abs(pct) * 50;
    if (pct >= 0) {
      altFill.style.bottom = '50%';
      altFill.style.height = magnitude + '%';
    } else {
      altFill.style.bottom = (50 - magnitude) + '%';
      altFill.style.height = magnitude + '%';
    }

    if (d.deadman) {
      deadmanPill.textContent = '● 데드맨 ON';
      deadmanPill.className = 'pill on';
      modeState.textContent = 'HITL (수동 조종)';
      modeState.className = 'big-state hitl';
    } else {
      deadmanPill.textContent = '● 데드맨 OFF';
      deadmanPill.className = 'pill off';
      modeState.textContent = 'HOTL (자율)';
      modeState.className = 'big-state hotl';
    }

    uxvPill.textContent = 'UxV: ' + (d.uxv ? 'DRONE' : 'UGV');
    returnPill.className = 'pill ' + (d.ret ? 'on' : 'off');
    returnPill.textContent = d.ret ? 'RETURN ●' : 'RETURN';

    drawAttitude(d.pitch, d.roll);
    drawCompass(d.heading);
  }

  function parseLine(line) {
    const parts = line.trim().split(',');
    if (parts.length !== 8) return null;
    const n = parts.map(Number);
    if (n.some((v) => Number.isNaN(v))) return null;
    return {
      pitch: n[0], roll: n[1], yaw: n[2], heading: n[3],
      alt: n[4], deadman: n[5] === 1, uxv: n[6] === 1, ret: n[7] === 1,
    };
  }

  async function startReading() {
    const textDecoder = new TextDecoderStream();
    port.readable.pipeTo(textDecoder.writable);
    const inputStream = textDecoder.readable;
    reader = inputStream.getReader();
    keepReading = true;
    let buf = '';

    try {
      while (keepReading) {
        const { value, done } = await reader.read();
        if (done) break;
        if (!value) continue;
        buf += value;
        let idx;
        while ((idx = buf.indexOf('\n')) >= 0) {
          const rawLine = buf.slice(0, idx).replace(/\r$/, '');
          buf = buf.slice(idx + 1);
          if (!rawLine) continue;
          lineCount += 1;
          lineCountEl.textContent = String(lineCount);
          const parsed = parseLine(rawLine);
          if (parsed) {
            appendLog(rawLine, false);
            updateUI(parsed);
          } else {
            appendLog(rawLine, true);
          }
        }
      }
    } catch (err) {
      appendLog('[읽기 오류] ' + err.message, true);
    }
  }

  async function connect() {
    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 115200 });
      setStatus(true, '연결됨 · 115200bps');
      connectBtn.disabled = true;
      disconnectBtn.disabled = false;
      simBtn.disabled = true;
      appendLog('[연결됨]', false);
      startReading();

      navigator.serial.addEventListener('disconnect', () => {
        if (port) handleDisconnect();
      });
    } catch (err) {
      appendLog('[연결 실패] ' + err.message, true);
      setStatus(false, '연결 실패');
    }
  }

  async function handleDisconnect() {
    keepReading = false;
    try { if (reader) { await reader.cancel(); reader = null; } } catch (e) {}
    try { if (port) { await port.close(); } } catch (e) {}
    port = null;
    setStatus(false, '연결 안 됨');
    connectBtn.disabled = false;
    disconnectBtn.disabled = true;
    simBtn.disabled = false;
    appendLog('[연결 해제됨]', false);
  }

  connectBtn.addEventListener('click', connect);
  disconnectBtn.addEventListener('click', handleDisconnect);

  // 데모 재생: 하드웨어 없이 리허설할 때 가짜 데이터로 UI 동작 확인
  simBtn.addEventListener('click', () => {
    if (simTimer) {
      clearInterval(simTimer);
      simTimer = null;
      simBtn.textContent = '데모 재생';
      appendLog('[데모 정지]', false);
      return;
    }
    simBtn.textContent = '데모 정지';
    appendLog('[데모 시작 — 가짜 데이터]', false);
    let t = 0;
    simTimer = setInterval(() => {
      t += 0.08;
      const fake = {
        pitch: Math.sin(t) * 30,
        roll: Math.cos(t * 0.7) * 25,
        yaw: Math.sin(t * 1.3) * 60,
        heading: (t * 20) % 360,
        alt: Math.round(Math.sin(t * 0.5) * 100),
        deadman: Math.floor(t) % 6 < 3,
        uxv: true,
        ret: Math.floor(t) % 10 === 0,
      };
      const line = [fake.pitch, fake.roll, fake.yaw, fake.heading, fake.alt,
        fake.deadman ? 1 : 0, fake.uxv ? 1 : 0, fake.ret ? 1 : 0]
        .map((v) => typeof v === 'number' && v % 1 !== 0 ? v.toFixed(1) : v).join(',');
      lineCount += 1;
      lineCountEl.textContent = String(lineCount);
      appendLog(line, false);
      updateUI(fake);
    }, 50);
  });

  if (!('serial' in navigator)) {
    unsupportedWarn.classList.add('show');
    connectBtn.disabled = true;
  }

  drawAttitude(0, 0);
  drawCompass(0);
})();
</script>

</body>
</html>
